services:
  agent:
    build: .
    container_name: rs_agent_db
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "python", "health_check.py"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    volumes:
      - ./logs:/rsagent_db/logs
      - shared_media:/app/media
    restart: always
    network_mode: "host"
    stop_grace_period: 45s

volumes:
  shared_media:



